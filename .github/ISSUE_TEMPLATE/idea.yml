name: Idea or feedback
description: A change to an existing skill, grounded in a failure you saw. One change per issue.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you observed and the change you propose. Include enough context for a maintainer to evaluate it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which existing skill this changes.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What went wrong
      description: The real session where the skill fell short. What you ran, what it did, and why that was a problem. Include harness and model.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The smallest change that fixes it. Describe it; don't paste a rewritten SKILL.md.
    validations:
      required: true
